name: Temporary Vercel access diagnostic

on:
  workflow_dispatch:
  push:
    branches: [feat/configurable-api-url]
    paths: [.github/workflows/diagnose-vercel.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel access without displaying secrets
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          org = os.environ['VERCEL_ORG_ID']
          project = os.environ['VERCEL_PROJECT_ID']
          token = os.environ['VERCEL_TOKEN']
          for name, value, prefix in [('organization', org, 'team_'), ('project', project, 'prj_'), ('token', token, '')]:
              print(f'{name}: present={bool(value)}, surrounding_whitespace={value != value.strip()}, expected_prefix={value.startswith(prefix)}')

          allowed_codes = {'forbidden', 'team_unauthorized', 'not_found', 'unauthorized', 'invalid_token', 'missing_token', 'project_not_found', 'bad_request'}
          paths = [
              ('account', '/v2/user'),
              ('team', '/teams/' + urllib.parse.quote(org, safe='')),
              ('team with scope', '/teams/' + urllib.parse.quote(org, safe='') + '?' + urllib.parse.urlencode({'teamId': org})),
              ('project', '/v9/projects/' + urllib.parse.quote(project, safe='') + '?' + urllib.parse.urlencode({'teamId': org})),
          ]
          failed = False
          for name, path in paths:
              request = urllib.request.Request('https://api.vercel.com' + path, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f'{name}: HTTP {response.status}')
                      if name == 'project':
                          data = json.load(response)
                          print(f'project: owner_matches_org={data.get("accountId") == org}, id_matches_project={data.get("id") == project}')
              except urllib.error.HTTPError as error:
                  failed = True
                  try:
                      code = json.load(error).get('error', {}).get('code')
                  except (ValueError, AttributeError):
                      code = None
                  print(f'{name}: HTTP {error.code}, error_code={code if code in allowed_codes else "other_or_unavailable"}')
              except Exception:
                  failed = True
                  print(f'{name}: request failed (details withheld)')
          raise SystemExit(1 if failed else 0)
          PY
